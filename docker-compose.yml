name: juil25-bde-crypto-main

services:
  postgres:
    image: postgres:15
    container_name: pg__crypto_example
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Variables utilisées par les scripts d'init pour créer l'utilisateur appli et sa DB
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      #AIRFLOW__WEBSERVER__BASE_URL: http://airflow-webserver:8080
      MODELS_DIR: /app/algo_crypto
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/app/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - models_data:/app/algo_crypto
      - models_data:/opt/airflow/repo/algo_crypto
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      #AIRFLOW__WEBSERVER__BASE_URL: http://airflow-webserver:8080
      MODELS_DIR: /app/algo_crypto
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/app/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - models_data:/app/algo_crypto
      - models_data:/opt/airflow/repo/algo_crypto
    command: scheduler

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models_data:/app/algo_crypto
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      MODELS_DIR: /app/algo_crypto
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models_data:/app/algo_crypto
    ports:
      - "8501:8501"

  # Services build uniquement pour produire les images utilisées par Airflow DockerOperator
  # Ne sont pas démarrés par défaut ; utiliser le profil 'images' pour les construire explicitement
  ml_pipeline_image:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml_pipeline
    image: crypto_ml_pipeline:latest
    profiles: ["images"]
    command: ["bash", "-lc", "echo Built ml_pipeline image"]

  data_pipeline_image:
    build:
      context: .
      dockerfile: docker/Dockerfile.data_pipeline
    image: crypto_data_pipeline:latest
    profiles: ["images"]
    command: ["bash", "-lc", "echo Built data_pipeline image"]

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/app/repo
      - models_data:/app/algo_crypto
      - models_data:/opt/airflow/repo/algo_crypto
    entrypoint: ""
    command:
      - bash
      - -c
      - |
          echo '== Migrating Airflow metadata DB =='
          airflow db migrate
          echo '== Creating admin user if absent =='
          airflow users create --username "$AIRFLOW_ADMIN_USER" --password "$AIRFLOW_ADMIN_PASSWORD" --firstname "a" --lastname "b" --role "Admin" --email "$AIRFLOW_ADMIN_EMAIL" || true
          echo 'Init OK'

volumes:
  pg_data:
  models_data:
    name: models_data