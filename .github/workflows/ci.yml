name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev --group api --group data_pipeline --group ml_pipeline --group streamlit

      - name: Run unit tests
        run: |
          uv run pytest -q tests/api/test_unitaire tests/airflow/test_unitaire tests/streamlit/test_unitaire

  integration-tests:
    name: Integration tests (optional)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev --group api --group data_pipeline --group ml_pipeline --group streamlit

      - name: Run integration tests
        run: |
          uv run pytest -q tests/api/test_integration tests/streamlit/test_integration

  airflow-integration-tests:
    name: Airflow integration contracts (optional)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install airflow test dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev --group airflow

      - name: Run airflow integration contract tests
        run: |
          uv run pytest -q tests/airflow/test_integration
