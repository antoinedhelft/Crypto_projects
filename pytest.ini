[pytest]
pythonpath = .
norecursedirs = .git .venv .cryptenv algo_crypto old_tests
testpaths = tests
markers =
    unitaire: Tests unitaires, rapides et sans dépendances externes (ni DB, ni API live, ni artefacts).
    integration: Tests d'intégration, plus lents, peuvent nécessiter des services (DB), des artefacts ou des API live.
    e2e: Tests end-to-end, nécessitent docker compose lancé avec tous les services.