global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'api'
    metrics_path: /metrics
    static_configs:
      - targets: ['juil25-bde-crypto-api-1:8000']
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['monitoring-cadvisor-1:8080']
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
